name: Supabase Keep-Alive

# Supabase free-tier projects pause after ~7 days without activity.
# This pings the database every 3 days so it never goes idle.
#
# The key below is the PUBLISHABLE (anon) key — it is public by design
# (it ships in the browser bundle) and every query it makes is still
# constrained by Row Level Security.
#
# Note: GitHub disables scheduled workflows after 60 days without repo
# activity — any commit (or the ping-back below) keeps it alive.

on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days at 06:17 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query themes table via REST
        run: |
          STATUS=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
            'https://epjfqwluriveoxbwxtpz.supabase.co/rest/v1/themes?select=id&limit=1' \
            -H 'apikey: sb_publishable_uLgOgZ_WzUOFw9wnFcvD0A_0kx97cXh' \
            -H 'Authorization: Bearer sb_publishable_uLgOgZ_WzUOFw9wnFcvD0A_0kx97cXh')
          echo "HTTP $STATUS"
          cat /tmp/body.txt
          test "$STATUS" = "200"
